name: curiosity (own interests — learns what IT finds worth knowing)
# Daily on GitHub's runners: scans HN + trending repos + open issues, scores
# against what the agent is FOR, learns the top interests, pushes skills.
# No human queue, no PC. Manual: Actions -> curiosity -> Run workflow.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
concurrency:
  group: curiosity
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  wonder:
    runs-on: ubuntu-latest
    outputs:
      topics: ${{ steps.curious.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pick own interests
        id: curious
        env:
          MAX_TOPICS: 2
        run: node src/curiosity.js
  learn:
    needs: wonder
    if: needs.wonder.outputs.topics != '' && needs.wonder.outputs.topics != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: learn each interest
        env:
          TOPICS_JSON: ${{ needs.wonder.outputs.topics }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "$TOPICS_JSON" | jq -r '.[] | "\(.slug)\u001f\(.topic)"' | while IFS=$(printf '\037') read -r slug topic; do
            echo "=== interest: $topic"
            TOPIC="$topic" FILENAME_HINT="$slug" node src/agent-learn.js || echo "skip: $topic"
          done
          node src/build-docs.js
      - name: commit + push
        run: |
          git config user.name "winagent-bot"
          git config user.email "winagent-bot@users.noreply.github.com"
          git add skills docs
          git diff --cached --quiet && echo "nothing new" || { git commit -m "curiosity: self-taught interests"; for i in 1 2 3; do git pull --rebase --autostash && break; git checkout --theirs -- docs/index.html 2>/dev/null || true; node src/build-docs.js 2>/dev/null || true; git add -A; GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort; sleep 5; done; git push; }
      - name: announce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow view curiosity --repo ${{ github.repository }} >/dev/null 2>&1 || true
