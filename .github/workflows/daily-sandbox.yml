name: daily-sandbox (autonomous test + health — no human, no PC)
# Runs 03:00 UTC daily on GitHub's runners: selftest matrix + live-page check.
# Skill refreshing moved to skill-refresh.yml (every 30 min). Failures
# open/comment a `sandbox-health` issue with the run link.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
concurrency:
  group: daily-sandbox
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/index.js --selftest
  webqa:
    runs-on: ubuntu-latest
    steps:
      - name: live pages + registry reachable
        run: |
          curl -fsSL -o /dev/null -w "pages:%{http_code}\n" https://achuthan17.github.io/windows-system-agent/
          curl -fsSL -o /dev/null -w "chat:%{http_code}\n" https://achuthan17.github.io/windows-system-agent/chat.html
          curl -fsSL -o /dev/null -w "models:%{http_code}\n" https://achuthan17.github.io/windows-system-agent/models.json
          curl -fsSL -o /dev/null -w "raw:%{http_code}\n" https://raw.githubusercontent.com/ACHUTHAN17/windows-system-agent/main/skills/self-learn.md
  report:
    needs: [selftest, webqa]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: open or update sandbox-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --search "sandbox-health in:title" --state open --json number -q '.[0].number')
          BODY="Daily sandbox FAILED — $RUN"
          if [ -z "$NUM" ]; then gh issue create --title "sandbox-health: daily run failed" --body "$BODY" --label "sandbox-health"; else gh issue comment "$NUM" --body "$BODY"; fi
  # COMPULSORY self-update guard: the brain MUST move. If no skill/model/doc
  # change landed in the last 24h, file a stale-brain issue and fail loudly —
  # silence is not an option.
  update-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: brain moved in the last 24h?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(git log --since="24 hours ago" --oneline -- skills/ docs/models.json docs/index.html | wc -l)
          echo "brain-changing commits in 24h: $N"
          if [ "$N" -eq 0 ]; then
            RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            NUM=$(gh issue list --search "stale-brain in:title" --state open --json number -q '.[0].number')
            BODY="Brain hasn't changed in 24h — autonomy loops may be stuck. $RUN"
            if [ -z "$NUM" ]; then gh issue create --title "stale-brain: no self-update in 24h" --body "$BODY" --label "stale-brain"; else gh issue comment "$NUM" --body "$BODY"; fi
            exit 1
          fi
