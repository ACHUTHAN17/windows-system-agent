name: Cross-platform WinAgent release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            command: npm run dist:win
          - name: macOS
            runner: macos-latest
            command: npm run dist:mac
          - name: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installers
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: WinAgent-${{ matrix.name }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  android-termux:
    name: Build Android Termux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package Android bundle
        run: |
          set -e
          mkdir -p android-termux/WinAgent
          cp -R src skills memory package.json ANDROID.md termux-install.sh android-termux/WinAgent/
          chmod +x android-termux/WinAgent/termux-install.sh
          tar -czf WinAgent-Android-Termux-${GITHUB_REF_NAME#desktop-v}.tar.gz -C android-termux WinAgent
          zip -qr WinAgent-Android-Termux-${GITHUB_REF_NAME#desktop-v}.zip android-termux
      - uses: actions/upload-artifact@v4
        with:
          name: WinAgent-Android-Termux
          path: |
            WinAgent-Android-Termux-*.tar.gz
            WinAgent-Android-Termux-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-desktop, android-termux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
