name: desktop-build (Windows installer for the WinAgent app)
# Two independent jobs on Windows runners:
#   test   - unit + UI + real-engine end-to-end tests (visible pass/fail, does not gate the installer)
#   build  - produces WinAgent-Setup-<version>.exe (installer, per-user, no admin needed)
#            and WinAgent-Portable-<version>.exe (single file, no install)
# Push a tag like `desktop-v1.0.1` (matching desktop/package.json "version") to also publish
# both files as a GitHub Release. Unsigned builds show a Windows SmartScreen prompt
# ("More info" -> "Run anyway").
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: [main]
    paths: ['desktop/**', 'src/**', '.github/workflows/desktop-build.yml']
permissions:
  contents: write
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: tests (parser, runner, sync, UI, real engine end-to-end)
        run: npm test
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: build installer + portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: WinAgent-windows
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
      - name: publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
