name: skill-crawl (learns other repos' skills — 24/7, no human)
# Every 5 min on GitHub's runners: scans known skill repos + discovery search,
# imports EVERYTHING new (bulk + rescan until dry), rebuilds docs, pushes.
# Rate-limit guard exits quietly when the keyless API budget runs low.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max skills to import (default 10, max 20)'
        required: false
concurrency:
  group: skill-crawl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: rate-limit guard (keyless budget is 60/hr)
        id: budget
        run: |
          LEFT=$(curl -fsSL https://api.github.com/rate_limit | jq -r '.resources.core.remaining // 0')
          echo "api budget left: $LEFT"
          if [ "$LEFT" -lt 15 ]; then echo "go=false" >> $GITHUB_OUTPUT; else echo "go=true" >> $GITHUB_OUTPUT; fi
      - name: crawl + adapt skills
        if: steps.budget.outputs.go == 'true'
        env:
          MAX_IMPORT: ${{ inputs.max }}
        run: |
          node src/skill-crawler.js
          node src/build-docs.js
      - name: commit + push if changed
        if: steps.budget.outputs.go == 'true'
        run: |
          git config user.name "winagent-bot"
          git config user.email "winagent-bot@users.noreply.github.com"
          git add skills docs
          git diff --cached --quiet && echo "nothing new to import" || { git commit -m "crawl: imported skills from GitHub"; for i in 1 2 3; do git pull --rebase --autostash && break; git checkout --theirs -- docs/index.html 2>/dev/null || true; node src/build-docs.js 2>/dev/null || true; git add -A; GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort; sleep 5; done; git push; }
