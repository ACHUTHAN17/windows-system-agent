name: skill-crawl (learns other repos' skills — daily, no human)
# Daily 06:00 UTC on GitHub's runners: scans known skill repos + discovery
# search, imports up to 2 new SKILL.md playbooks (adapted, provenance in
# skills/sources.json), rebuilds docs, pushes. Keyless public API only.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max skills to import (default 2, max 5)'
        required: false
concurrency:
  group: skill-crawl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: crawl + adapt skills
        env:
          MAX_IMPORT: ${{ inputs.max }}
        run: |
          node src/skill-crawler.js
          node src/build-docs.js
      - name: commit + push if changed
        run: |
          git config user.name "winagent-bot"
          git config user.email "winagent-bot@users.noreply.github.com"
          git add skills docs
          git diff --cached --quiet && echo "nothing new to import" || { git commit -m "crawl: imported skills from GitHub"; for i in 1 2 3; do git pull --rebase --autostash && break; git checkout --theirs -- docs/index.html 2>/dev/null || true; node src/build-docs.js 2>/dev/null || true; git add -A; GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort; sleep 5; done; git push; }
